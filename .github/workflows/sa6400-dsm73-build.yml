name: Build SA6400 DSM 7.3 Kernel (via dsm_linux)
#".github/workflows/sa6400-dsm73-build.yml"

on:
  workflow_dispatch:
    inputs:
      # 수동 실행 시 옵션을 넣고 싶다면 아래처럼 정의
      build_type:
        description: 'Build type: zImage, modules, or all'
        required: false
        default: 'all'
        type: choice
        options:
          - 'zImage'
          - 'modules'
          - 'all'

jobs:
  build-sa6400-dsm73:
    runs-on: ubuntu-latest

    env:
      DSM_VERSION: "7.3"
      PLATFORM: "epyc7002"

      # Git 브랜치 사용
      DSM_LINUX_REPO: "https://github.com/PeterSuh-Q3/dsm_linux.git"
      DSM_LINUX_BRANCH: "epyc7002-7.3-5.10.55"

      TOOLCHAIN_URL: "https://global.synologydownload.com/download/ToolChain/toolchain/7.3-86009/AMD%20x86%20Linux%20Linux%205.10.55%20%28epyc7002%29/epyc7002-gcc1220_glibc236_x86_64-GPL.txz"
      TOOLCHAIN_DIR: "${{ github.workspace }}/toolchain"
      KERNEL_SRC_DIR: "${{ github.workspace }}/dsm_linux"
      BUILD_OUTPUT_DIR: "${{ github.workspace }}/build-output"

      KERNEL_CONFIG_PATH: "${{ github.workspace }}/configs/sa6400_dsm73.config"
      MODULE_SYMVERS_PATH: "${{ github.workspace }}/configs/sa6400_dsm73.Module.symvers"
    #---

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            libncurses5-dev \
            libssl-dev \
            cpio \
            xz-utils \
            flex \
            bison \
            wget \
            tar \
            python3 \
            git \
            rsync

      - name: Download Synology epyc7002 toolchain
        run: |
          set -eux

          mkdir -p "$TOOLCHAIN_DIR" downloads
          cd downloads

          echo "==> Downloading toolchain from $TOOLCHAIN_URL"
          wget -O toolchain.txz "$TOOLCHAIN_URL"
          tar -Jxf toolchain.txz -C "$TOOLCHAIN_DIR"

      - name: Clone PeterSuh-Q3 dsm_linux (epyc7002-7.3-5.10.55)
        run: |
          set -eux

          if [ -d "$KERNEL_SRC_DIR" ]; then
            rm -rf "$KERNEL_SRC_DIR"
          fi

          git clone -b "$DSM_LINUX_BRANCH" "$DSM_LINUX_REPO" "$KERNEL_SRC_DIR"

      - name: Locate toolchain and kernel source
        id: locate
        run: |
          set -eux

          # x86_64-pc-linux-gnu-gcc 위치 탐색 (epyc7002 툴체인)
          TOOLCHAIN_GCC_BIN="$(find "$TOOLCHAIN_DIR" -maxdepth 4 -type f -name 'x86_64-pc-linux-gnu-gcc' | head -n 1 || true)"
          if [ -z "$TOOLCHAIN_GCC_BIN" ]; then
            echo "x86_64-pc-linux-gnu-gcc not found under $TOOLCHAIN_DIR"
            exit 1
          fi

          TOOLCHAIN_BIN_DIR="$(dirname "$TOOLCHAIN_GCC_BIN")"
          CROSS_COMPILE_PREFIX="$(basename "$TOOLCHAIN_GCC_BIN" | sed 's/gcc$//')"

          echo "TOOLCHAIN_BIN_DIR=$TOOLCHAIN_BIN_DIR" >> "$GITHUB_OUTPUT"
          echo "CROSS_COMPILE_PREFIX=$CROSS_COMPILE_PREFIX" >> "$GITHUB_OUTPUT"

          # git으로 받은 커널 트리 위치 (예: dsm_linux/)
          echo "KERNEL_TREE=$KERNEL_SRC_DIR" >> "$GITHUB_OUTPUT"

      - name: Build zImage and modules for SA6400 (epyc7002)
        run: |
          set -eux

          TOOLCHAIN_BIN_DIR="${{ steps.locate.outputs.TOOLCHAIN_BIN_DIR }}"
          CROSS_COMPILE_PREFIX="${{ steps.locate.outputs.CROSS_COMPILE_PREFIX }}"
          KERNEL_TREE="${{ steps.locate.outputs.KERNEL_TREE }}"

          echo "==> Using toolchain from: $TOOLCHAIN_BIN_DIR"
          echo "==> Kernel tree: $KERNEL_TREE"

          export PATH="$TOOLCHAIN_BIN_DIR:$PATH"
          export ARCH=x86_64
          export CROSS_COMPILE="$CROSS_COMPILE_PREFIX"

          cd "$KERNEL_TREE"

          # SA6400 DSM 7.3용 .config / Module.symvers 사용
          if [ -f "$KERNEL_CONFIG_PATH" ]; then
            echo "==> Copying pre-saved SA6400 DSM 7.3 .config"
            cp "$KERNEL_CONFIG_PATH" .config
          fi

          if [ -f "$MODULE_SYMVERS_PATH" ]; then
            echo "==> Copying pre-saved Module.symvers"
            cp "$MODULE_SYMVERS_PATH" Module.symvers
          fi

          # 만약 Synology 설정이 별도의 디렉터리에 있다면
          # e.g. dsm_linux/epyc7002/defconfig → .config로 복사
          if [ ! -f ".config" ] && [ -f "synology/synoconfigs/epyc7002" ]; then
            echo "==> Using dsm_linux synoconfigs/epyc7002"
            cp "synology/synoconfigs/epyc7002" .config
          fi

          # Synology 설정 기준으로 구성
          make olddefconfig

          # 필요하면 patches/*.patch 적용
          if ls "${GITHUB_WORKSPACE:-$PWD}/patches"/*.patch >/dev/null 2>&1; then
            echo "==> Applying local patches..."
            for p in "${GITHUB_WORKSPACE:-$PWD}"/patches/*.patch; do
              echo "Applying $p"
              patch -p1 < "$p"
            done
          fi

          # zImage / modules 빌드
          make -j"$(nproc)" zImage
          make -j"$(nproc)" modules

          # 결과물 수집
          mkdir -p "$BUILD_OUTPUT_DIR/modules"

          # 대표적인 zImage/bzImage 위치 확인 후 복사
          if [ -f "arch/x86/boot/bzImage" ]; then
            cp arch/x86/boot/bzImage "$BUILD_OUTPUT_DIR/zImage-sa6400-dsm73"
          elif [ -f "arch/x86/boot/zImage" ]; then
            cp arch/x86/boot/zImage "$BUILD_OUTPUT_DIR/zImage-sa6400-dsm73"
          else
            echo "zImage/bzImage not found; please check kernel tree layout."
            exit 1
          fi

          # 모듈 설치 후 tar로 묶기
          make INSTALL_MOD_PATH="$BUILD_OUTPUT_DIR/modules_root" modules_install

          cd "$BUILD_OUTPUT_DIR"
          tar -C modules_root -czf modules-sa6400-dsm73.tar.gz lib

      - name: Upload artifacts (zImage and modules)
        uses: actions/upload-artifact@v4
        with:
          name: sa6400-dsm73-kernel
          path: |
            ${{ env.BUILD_OUTPUT_DIR }}/zImage-sa6400-dsm73
            ${{ env.BUILD_OUTPUT_DIR }}/modules-sa6400-dsm73.tar.gz

name: Build DSM bzImage + Modules (All Platforms)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # 1) DSM 7.3 epyc7002 (pilot)
          - dsm_version: "7.3"
            platform: "epyc7002"
            kernel_ver: "5.10.55"
            dsm_linux_branch: "epyc7002-7.3-5.10.55"
            toolchain_key: "toolchain-epyc7002-7.3-86009"
            toolchain_url: "https://global.synologydownload.com/download/ToolChain/toolchain/7.3-86009/AMD%20x86%20Linux%20Linux%205.10.55%20%28epyc7002%29/epyc7002-gcc1220_glibc236_x86_64-GPL.txz"

          # 2) DSM 7.3 geminilakenk
          - dsm_version: "7.3"
            platform: "geminilakenk"
            kernel_ver: "5.10.55"
            dsm_linux_branch: "geminilakenk-7.3-5.10.55"
            toolchain_key: "toolchain-geminilakenk-7.3-86009"
            toolchain_url: "https://global.synologydownload.com/download/ToolChain/toolchain/7.3-86009/Intel%20x86%20Linux%205.10.55%20%28geminilakenk%29/geminilakenk-gcc1220_glibc236_x86_64-GPL.txz"

          # 3) DSM 7.3 r1000nk
          - dsm_version: "7.3"
            platform: "r1000nk"
            kernel_ver: "5.10.55"
            dsm_linux_branch: "r1000nk-7.3-5.10.55"
            toolchain_key: "toolchain-r1000nk-7.3-86009"
            toolchain_url: "https://global.synologydownload.com/download/ToolChain/toolchain/7.3-86009/AMD%20x86%20Linux%205.10.55%20%28r1000nk%29/r1000nk-gcc1220_glibc236_x86_64-GPL.txz"

          # 4) DSM 7.3 v1000nk
          - dsm_version: "7.3"
            platform: "v1000nk"
            kernel_ver: "5.10.55"
            dsm_linux_branch: "v1000nk-7.3-5.10.55"
            toolchain_key: "toolchain-v1000nk-7.3-86009"
            toolchain_url: "https://global.synologydownload.com/download/ToolChain/toolchain/7.3-86009/AMD%20x86%20Linux%205.10.55%20%28v1000nk%29/v1000nk-gcc1220_glibc236_x86_64-GPL.txz"

    env:
      DSM_LINUX_REPO: "https://github.com/PeterSuh-Q3/dsm_linux.git"

    steps:
      - name: Set runtime environment paths
        run: |
          echo "TOOLCHAIN_DIR=${{ runner.temp }}/toolchain"       >> $GITHUB_ENV
          echo "KERNEL_SRC_DIR=${{ github.workspace }}/dsm_linux" >> $GITHUB_ENV
          echo "BUILD_OUTPUT_DIR=${{ github.workspace }}/build-output" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc libncurses5-dev libssl-dev cpio xz-utils \
            flex bison wget tar python3 git rsync libelf-dev dwarves

      - name: Cache Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/toolchain
          key: ${{ matrix.toolchain_key }}

      - name: Download Synology toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p "$TOOLCHAIN_DIR"
          wget -O /tmp/toolchain.txz "${{ matrix.toolchain_url }}"
          tar -Jxf /tmp/toolchain.txz -C "$TOOLCHAIN_DIR"
          rm -f /tmp/toolchain.txz

      - name: Clone dsm_linux (specific branch)
        run: |
          set -eux
          rm -rf "$KERNEL_SRC_DIR"
          git clone --depth 1 --single-branch \
            -b "${{ matrix.dsm_linux_branch }}" \
            "$DSM_LINUX_REPO" "$KERNEL_SRC_DIR"

      - name: Locate toolchain and kernel source
        id: locate
        run: |
          set -eux
          TOOLCHAIN_GCC_BIN="$(find "$TOOLCHAIN_DIR" -maxdepth 6 -type f \
            -name 'x86_64-pc-linux-gnu-gcc' | head -n 1 || true)"
          if [ -z "$TOOLCHAIN_GCC_BIN" ]; then
            echo "ERROR: x86_64-pc-linux-gnu-gcc not found under $TOOLCHAIN_DIR"
            find "$TOOLCHAIN_DIR" -maxdepth 6 -type f -name '*gcc*' || true
            exit 1
          fi
          echo "Found GCC: $TOOLCHAIN_GCC_BIN"
          echo "TOOLCHAIN_BIN_DIR=$(dirname "$TOOLCHAIN_GCC_BIN")" >> "$GITHUB_OUTPUT"
          echo "CROSS_COMPILE_PREFIX=$(basename "$TOOLCHAIN_GCC_BIN" | sed 's/gcc$//')" >> "$GITHUB_OUTPUT"
          echo "KERNEL_TREE=$KERNEL_SRC_DIR" >> "$GITHUB_OUTPUT"

      - name: Build bzImage and/or Modules
        env:
          KBUILD_BUILD_USER: "PeterSuh-Q3"
          KBUILD_BUILD_HOST: "MSHELL"
        run: |
          set -eux
          mkdir -p "$BUILD_OUTPUT_DIR"

          TOOLCHAIN_BIN_DIR="${{ steps.locate.outputs.TOOLCHAIN_BIN_DIR }}"
          CROSS_COMPILE_PREFIX="${{ steps.locate.outputs.CROSS_COMPILE_PREFIX }}"
          KERNEL_TREE="${{ steps.locate.outputs.KERNEL_TREE }}"

          export PATH="$TOOLCHAIN_BIN_DIR:$PATH"
          export ARCH=x86_64
          export CROSS_COMPILE="$CROSS_COMPILE_PREFIX"

          cd "$KERNEL_TREE"

          make mrproper

          # r1000nk/v1000nk branches miss lowercase xt_mark header expected by xt_mark.c
          if [ ! -f include/linux/netfilter/xt_mark.h ]; then
            mkdir -p include/linux/netfilter
            printf '#ifndef _XT_MARK_H\n#define _XT_MARK_H\n#include <linux/types.h>\n\nstruct xt_mark_tginfo2 {\n\t__u32 mark, mask;\n};\n\nstruct xt_mark_mtinfo1 {\n\t__u32 mark, mask;\n\t__u8 invert;\n};\n\n#endif /* _XT_MARK_H */\n' \
              > include/linux/netfilter/xt_mark.h
          fi

          # ✅ synology/certs 생성 (mrproper 이후)
          mkdir -p synology/certs
          touch synology/certs/trusted_certificates.pem
          touch synology/certs/signing_key.pem

          # ✅ __DECOMPRESSION_TYPE__ 플레이스홀더 치환
          DECOMPRESSION_TYPE=$(shuf -i 1001-2147483647 -n 1)
          sed -i "s/__DECOMPRESSION_TYPE__/${DECOMPRESSION_TYPE}/g" \
              arch/x86/boot/compressed/head_64.S \
              lib/synolib/syno_kexec_test.c
          echo "DECOMPRESSION_TYPE=${DECOMPRESSION_TYPE} 적용 완료"

          # ✅ .config: synology/synoconfigs 사용
          if [ ! -f "synology/synoconfigs/${{ matrix.platform }}" ]; then
            echo "ERROR: Config not found at synology/synoconfigs/${{ matrix.platform }}"
            exit 1
          fi
          cp "synology/synoconfigs/${{ matrix.platform }}" .config

          make olddefconfig

          # ✅ 공통 CONFIG 오버라이드
          DEBUG_OPTS=(
            "CONFIG_DEBUG_INFO_BTF=n"
            "CONFIG_DEBUG_INFO=n"
            "CONFIG_DEBUG_INFO_DWARF5=n"
            "CONFIG_DEBUG_INFO_REDUCED=n"
            "CONFIG_GDB_SCRIPTS=n"
            "CONFIG_SLIM_DEBUG_INFO=n"
            "CONFIG_SYNO_RAMDISK_INTEGRITY_CHECK=n"
            "CONFIG_RD_XZ=y"
            "CONFIG_SYSTEM_TRUSTED_KEYS=\"\""
            "CONFIG_SYSTEM_EXTRA_CERTIFICATE_SIZE=0"
            'CONFIG_MODULE_SIG_KEY="certs/signing_key.pem"'
          )
          for opt in "${DEBUG_OPTS[@]}"; do
            OPT_NAME="${opt%%=*}"
            sed -i "/^${OPT_NAME}=/d" .config
            sed -i "/^# ${OPT_NAME} is not set/d" .config
            echo "$opt" >> .config
          done

          make olddefconfig
          echo "Applied DEBUG_OPTS for ${{ matrix.platform }}"

          # ✅ 추가 모듈 활성화 (mshell-modules 호환성: NIC/SCSI/TCP/IPMI/MMC)
          EXTRA_OPTS=(
            # --- NIC: Intel ---
            "CONFIG_E1000=m"
            "CONFIG_E1000E=m"
            "CONFIG_IGBVF=m"
            "CONFIG_IXGB=m"
            "CONFIG_IXGBE=m"
            "CONFIG_IXGBEVF=m"
            "CONFIG_I40E=m"
            "CONFIG_IAVF=m"
            "CONFIG_ICE=m"
            "CONFIG_IGC=m"
            # --- NIC: Mellanox ---
            "CONFIG_MLX4_CORE=m"
            "CONFIG_MLX4_EN=m"
            "CONFIG_MLX5_CORE=m"
            "CONFIG_MLXFW=m"
            # --- NIC: Broadcom ---
            "CONFIG_BNXT=m"
            "CONFIG_BNX2=m"
            "CONFIG_BNX2X=m"
            "CONFIG_TIGON3=m"
            "CONFIG_B44=m"
            # --- NIC: Atheros ---
            "CONFIG_ALX=m"
            "CONFIG_ATL1C=m"
            "CONFIG_ATL1E=m"
            # --- NIC: Marvell ---
            "CONFIG_SKGE=m"
            "CONFIG_SKY2=m"
            # --- NIC: QLogic/Cavium ---
            "CONFIG_QED=m"
            "CONFIG_QEDE=m"
            "CONFIG_QLA3XXX=m"
            "CONFIG_QLCNIC=m"
            "CONFIG_QLGE=m"
            # --- NIC: Solarflare ---
            "CONFIG_SFC=m"
            # --- NIC: Neterion ---
            "CONFIG_S2IO=m"
            "CONFIG_VXGE=m"
            # --- NIC: 기타 ---
            "CONFIG_VMXNET3=m"
            "CONFIG_R8169=m"
            "CONFIG_8139CP=m"
            "CONFIG_TEHUTI=m"
            "CONFIG_FORCEDETH=m"
            "CONFIG_JME=m"
            "CONFIG_VIA_VELOCITY=m"
            "CONFIG_NETXEN_NIC=m"
            # --- NIC: USB ---
            "CONFIG_USB_NET_AQC111=m"
            "CONFIG_USB_NET_AX8817X=m"
            "CONFIG_USB_NET_DM9601=m"
            "CONFIG_USB_RTL8150=m"
            "CONFIG_USB_RTL8152=m"
            # --- SCSI/SAS HBA ---
            "CONFIG_MEGARAID_SAS=m"
            "CONFIG_MEGARAID_MAILBOX=m"
            "CONFIG_MEGARAID_MM=m"
            "CONFIG_MEGARAID_NEWGEN=m"
            "CONFIG_MEGARAID_LEGACY=m"
            "CONFIG_SCSI_HPSA=m"
            "CONFIG_SCSI_ARCMSR=m"
            "CONFIG_SCSI_MPT3SAS=m"
            "CONFIG_SCSI_MPI3MR=m"
            "CONFIG_SCSI_AACRAID=m"
            "CONFIG_SCSI_SMARTPQI=m"
            "CONFIG_SCSI_MVSAS=m"
            "CONFIG_SCSI_ISCI=m"
            "CONFIG_VMWARE_PVSCSI=m"
            "CONFIG_SCSI_TRANSPORT_FC=m"
            "CONFIG_SCSI_TRANSPORT_SPI=m"
            "CONFIG_SCSI_SAS_ATTRS=m"
            "CONFIG_SCSI_SAS_LIBSAS=m"
            "CONFIG_SCSI_ISCSI_ATTRS=m"
            "CONFIG_LIBISCSI=m"
            "CONFIG_LIBISCSI_TCP=m"
            # --- TCP 혼잡제어 ---
            "CONFIG_TCP_CONG_BBR=m"
            "CONFIG_TCP_CONG_BIC=m"
            "CONFIG_TCP_CONG_CDG=m"
            "CONFIG_TCP_CONG_DCTCP=m"
            "CONFIG_TCP_CONG_HIGHSPEED=m"
            "CONFIG_TCP_CONG_HTCP=m"
            "CONFIG_TCP_CONG_HYBLA=m"
            "CONFIG_TCP_CONG_ILLINOIS=m"
            "CONFIG_TCP_CONG_LP=m"
            "CONFIG_TCP_CONG_NV=m"
            "CONFIG_TCP_CONG_SCALABLE=m"
            "CONFIG_TCP_CONG_VEGAS=m"
            "CONFIG_TCP_CONG_VENO=m"
            "CONFIG_TCP_CONG_WESTWOOD=m"
            "CONFIG_TCP_CONG_YEAH=m"
            # --- IPMI/BMC ---
            "CONFIG_IPMI_HANDLER=m"
            "CONFIG_IPMI_SI=m"
            "CONFIG_IPMI_SSIF=m"
            "CONFIG_IPMI_DEVICE_INTERFACE=m"
            # --- MMC/SD ---
            "CONFIG_MMC=m"
            "CONFIG_MMC_BLOCK=m"
            "CONFIG_MMC_CORE=m"
            "CONFIG_MMC_CQHCI=m"
            "CONFIG_MMC_SDHCI=m"
            "CONFIG_MMC_SDHCI_PCI=m"
            "CONFIG_MMC_SDHCI_PLTFM=m"
            "CONFIG_MMC_SDHCI_ACPI=m"
            # --- 네트워크 스케줄러 ---
            "CONFIG_NET_SCH_CAKE=m"
            "CONFIG_NET_SCH_CODEL=m"
            "CONFIG_NET_SCH_FQ=m"
            "CONFIG_NET_SCH_FQ_CODEL=m"
            "CONFIG_NET_SCH_FQ_PIE=m"
            "CONFIG_NET_SCH_MQPRIO=m"
            "CONFIG_NET_SCH_MULTIQ=m"
            "CONFIG_NET_SCH_PIE=m"
            # --- Netfilter 확장 ---
            "CONFIG_NETFILTER_XT_MATCH_COMMENT=m"
            "CONFIG_NETFILTER_XT_MATCH_CONNMARK=m"
            "CONFIG_NETFILTER_XT_MATCH_MARK=m"
            "CONFIG_NETFILTER_XT_MATCH_OWNER=m"
            "CONFIG_NETFILTER_XT_MATCH_STRING=m"
            "CONFIG_NETFILTER_XT_MATCH_TCPUDP=m"
            "CONFIG_NETFILTER_XT_TARGET_NAT=m"
            "CONFIG_IP_NF_RAW=m"
            "CONFIG_IP6_NF_NAT=m"
            "CONFIG_IP6_NF_RAW=m"
            # --- hwmon 센서 ---
            "CONFIG_SENSORS_LM75=m"
            "CONFIG_SENSORS_LM78=m"
            "CONFIG_SENSORS_LM90=m"
            "CONFIG_SENSORS_ADM1021=m"
            "CONFIG_SENSORS_ADM1031=m"
            "CONFIG_SENSORS_ADM9240=m"
            "CONFIG_SENSORS_ADT7470=m"
            "CONFIG_SENSORS_NCT6775=m"
            "CONFIG_SENSORS_NCT6683=m"
            "CONFIG_SENSORS_IT87=m"
            "CONFIG_SENSORS_CORETEMP=m"
            "CONFIG_SENSORS_DRIVETEMP=m"
            "CONFIG_SENSORS_DME1737=m"
            "CONFIG_SENSORS_F71882FG=m"
            "CONFIG_SENSORS_F75375S=m"
            "CONFIG_SENSORS_JC42=m"
            "CONFIG_SENSORS_LM95245=m"
            "CONFIG_SENSORS_W83781D=m"
            "CONFIG_SENSORS_W83793=m"
            "CONFIG_SENSORS_PMBUS=m"
            "CONFIG_SENSORS_PWM_FAN=m"
            "CONFIG_PMBUS=m"
            # --- I2C 버스 드라이버 ---
            "CONFIG_I2C_CHARDEV=m"
            "CONFIG_I2C_PIIX4=m"
            "CONFIG_I2C_ISMT=m"
            "CONFIG_I2C_DESIGNWARE_PCI=m"
            "CONFIG_I2C_AMD_MP2=m"
            "CONFIG_I2C_AMD756=m"
            "CONFIG_I2C_AMD8111=m"
            "CONFIG_I2C_NFORCE2=m"
            "CONFIG_I2C_NVIDIA_GPU=m"
            "CONFIG_I2C_MLXCPLD=m"
            "CONFIG_I2C_MUX_PCA954x=m"
            "CONFIG_I2C_MUX_PCA9541=m"
            "CONFIG_I2C_MUX_REG=m"
            "CONFIG_I2C_GPIO=m"
            "CONFIG_I2C_OCORES=m"
            "CONFIG_I2C_TINY_USB=m"
            "CONFIG_REGMAP_I2C=m"
            "CONFIG_REGMAP_MMIO=m"
            # --- LSI Fusion MPT HBA ---
            "CONFIG_FUSION=m"
            "CONFIG_FUSION_SAS=m"
            "CONFIG_FUSION_SPI=m"
            "CONFIG_FUSION_CTL=m"
            # --- InfiniBand ---
            "CONFIG_INFINIBAND_ADDR_TRANS=m"
            "CONFIG_INFINIBAND_USER_MAD=m"
            "CONFIG_INFINIBAND_QEDR=m"
            # --- VMware ---
            "CONFIG_VMW_VMCI=m"
            "CONFIG_VSOCK=m"
            "CONFIG_VSOCK_LOOPBACK=m"
            "CONFIG_VMW_VSOCK_VMCI_TRANSPORT=m"
            "CONFIG_VMW_VSOCK_VIRTIO_TRANSPORT=m"
            "CONFIG_VMW_VSOCK_VIRTIO_TRANSPORT_COMMON=m"
            # --- 파일시스템 ---
            "CONFIG_NTFS_FS=m"
            "CONFIG_9P_FS=m"
            # --- ATA/스토리지 ---
            # CONFIG_ATA_PIIX 제외: syno_libata_disk_power_loss_when_reboot 미정의 심볼
            # "CONFIG_ATA_PIIX=m"
            "CONFIG_SCSI_AIC94XX=m"
            "CONFIG_BLK_MQ_VIRTIO=m"
            # --- GPU/FB ---
            "CONFIG_FB=m"
            "CONFIG_FB_VESA=m"
            # --- GPIO ---
            "CONFIG_GPIO_IT87=m"
            "CONFIG_GPIO_F7188X=m"
            "CONFIG_GPIO_SCH=m"
            # --- 기타 ---
            "CONFIG_ACPI_PROCESSOR=m"
            "CONFIG_CPU_FREQ_STAT=m"
            "CONFIG_INTEL_IDLE=m"
            "CONFIG_INPUT_EVDEV=m"
            "CONFIG_TEXTSEARCH=m"
            "CONFIG_TEXTSEARCH_BM=m"
            "CONFIG_TEXTSEARCH_FSM=m"
            "CONFIG_TEXTSEARCH_KMP=m"
            "CONFIG_XZ_DEC=m"
            "CONFIG_MISC_RTSX=m"
            "CONFIG_CRC8=m"
            "CONFIG_MDIO=m"
            "CONFIG_REALTEK_PHY=m"
            "CONFIG_BCM_NET_PHYLIB=m"
            "CONFIG_MDEV=m"
            "CONFIG_VFIO_MDEV=m"
            "CONFIG_HP_ILO=m"
            "CONFIG_RTC_DRV_CMOS=m"
            "CONFIG_LEDS_CLASS=m"
          )
          for opt in "${EXTRA_OPTS[@]}"; do
            OPT_NAME="${opt%%=*}"
            sed -i "/^${OPT_NAME}=/d" .config
            sed -i "/^# ${OPT_NAME} is not set/d" .config
            echo "$opt" >> .config
          done

          make olddefconfig
          echo "Applied EXTRA_OPTS for ${{ matrix.platform }}"

          # ✅ r1000nk / v1000nk: synoconfig에 CONFIG_DRM=not set → amdgpu 명시 활성화
          # epyc7002/geminilakenk는 synoconfig에 이미 DRM_AMDGPU 풀옵션 활성화되어 있으므로 제외
          if [[ "${{ matrix.platform }}" == "r1000nk" || "${{ matrix.platform }}" == "v1000nk" ]]; then
            AMDGPU_OPTS=(
              "CONFIG_DRM=m"
              "CONFIG_DRM_KMS_HELPER=m"
              "CONFIG_DRM_TTM=m"
              "CONFIG_DRM_TTM_HELPER=m"
              "CONFIG_DRM_SCHED=m"
              "CONFIG_DRM_GEM_SHMEM_HELPER=m"
              "CONFIG_DRM_PANEL_ORIENTATION_QUIRKS=m"
              "CONFIG_DRM_AMDGPU=m"
              "CONFIG_DRM_AMDGPU_USERPTR=y"
              "CONFIG_DRM_AMDGPU_SI=n"
              "CONFIG_DRM_AMDGPU_CIK=n"
              "CONFIG_DRM_AMD_DC=n"
              "CONFIG_DRM_BUDDY=m"
              "CONFIG_HDMI=m"
              "CONFIG_I2C_ALGOBIT=m"
              "CONFIG_BACKLIGHT_CLASS_DEVICE=m"
              "CONFIG_BACKLIGHT_LCD_SUPPORT=y"
            )
            for opt in "${AMDGPU_OPTS[@]}"; do
              OPT_NAME="${opt%%=*}"
              sed -i "/^${OPT_NAME}=/d" .config
              sed -i "/^# ${OPT_NAME} is not set/d" .config
              echo "$opt" >> .config
            done
            make olddefconfig
            echo "Applied AMDGPU_OPTS for ${{ matrix.platform }}"
          fi

          OUT_TAG="${{ matrix.platform }}-${{ matrix.dsm_version }}-${{ matrix.kernel_ver }}"

          # ✅ bzImage 빌드
          if true; then
            make -j"$(nproc)" \
              HOSTCC="gcc -Wno-error=use-after-free -Wno-error=array-bounds -Wno-error=dangling-pointer" \
              HOSTCXX="g++ -Wno-error=use-after-free -Wno-error=array-bounds" \
              EXTRA_CFLAGS="-Wno-error=use-after-free" \
              bzImage
            if [ ! -f "arch/x86/boot/bzImage" ]; then
              echo "ERROR: arch/x86/boot/bzImage not found!"
              exit 1
            fi
            cp "arch/x86/boot/bzImage" "$BUILD_OUTPUT_DIR/bzImage-${OUT_TAG}"
            gzip -9 "$BUILD_OUTPUT_DIR/bzImage-${OUT_TAG}"
            echo "bzImage build complete: $BUILD_OUTPUT_DIR/bzImage-${OUT_TAG}.gz"
          fi

          # ✅ Modules 빌드
          if true; then
            make -j"$(nproc)" \
              HOSTCC="gcc -Wno-error=use-after-free -Wno-error=array-bounds -Wno-error=dangling-pointer" \
              HOSTCXX="g++ -Wno-error=use-after-free -Wno-error=array-bounds" \
              EXTRA_CFLAGS="-Wno-error=use-after-free" \
              modules

            MODULES_INSTALL_DIR="$BUILD_OUTPUT_DIR/modules_root-${OUT_TAG}"
            make INSTALL_MOD_PATH="$MODULES_INSTALL_DIR" modules_install

            KERNEL_VER_DIR=$(find "$MODULES_INSTALL_DIR/lib/modules" -maxdepth 1 -mindepth 1 -type d | head -1)
            FLAT_MODULES_DIR="$BUILD_OUTPUT_DIR/flat-modules-${OUT_TAG}"
            mkdir -p "$FLAT_MODULES_DIR"
            find "$KERNEL_VER_DIR/kernel" -type f -name "*.ko" -exec cp -t "$FLAT_MODULES_DIR" {} +

            tar -czf "$BUILD_OUTPUT_DIR/${OUT_TAG}.tgz" -C "$FLAT_MODULES_DIR" .
            echo "Modules build complete: $BUILD_OUTPUT_DIR/${OUT_TAG}.tgz"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.platform }}-${{ matrix.dsm_version }}
          path: |
            ${{ github.workspace }}/build-output/bzImage-${{ matrix.platform }}-${{ matrix.dsm_version }}-${{ matrix.kernel_ver }}.gz
            ${{ github.workspace }}/build-output/${{ matrix.platform }}-${{ matrix.dsm_version }}-${{ matrix.kernel_ver }}.tgz
          if-no-files-found: ignore

  publish:
    name: Publish artifacts to master branch root
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: Copy artifacts to repo root
        run: |
          set -eux
          find /tmp/artifacts -type f \( -name "*.gz" -o -name "*.tgz" \) | while read f; do
            cp "$f" .
          done
          ls -lh *.gz *.tgz

      - name: Commit and push to master
        run: |
          set -eux
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.gz *.tgz
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "release: DSM 7.3 bzImage + modules for all 4 platforms (run ${{ github.run_id }})"
            git push origin master
          fi

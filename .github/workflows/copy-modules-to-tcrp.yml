name: Copy Module Tarballs to tcrp-modules

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build DSM bzImage + Modules (All Platforms)"]
    types:
      - completed
    branches:
      - master

jobs:
  copy:
    name: Copy .tgz to tcrp-modules and update JSON sha256
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout dsm_linux master (source tarballs)
        uses: actions/checkout@v4
        with:
          repository: PeterSuh-Q3/dsm_linux
          ref: master
          path: dsm_linux

      - name: Checkout tcrp-modules (destination)
        uses: actions/checkout@v4
        with:
          repository: PeterSuh-Q3/tcrp-modules
          ref: main
          path: tcrp-modules
          token: ${{ secrets.PAT }}

      - name: Checkout redpill-load (bzImage destination)
        uses: actions/checkout@v4
        with:
          repository: PeterSuh-Q3/redpill-load
          ref: master
          path: redpill-load
          token: ${{ secrets.PAT }}

      - name: Copy tarballs and update JSON sha256
        run: |
          set -eux
          RELEASES="tcrp-modules/custom-modules/releases"
          DSM_VER="7.3"
          KVER="5.10.55"

          for PLATFORM in epyc7002 geminilakenk r1000nk v1000nk; do
            TGZ="${PLATFORM}-${DSM_VER}-${KVER}.tgz"
            JSON="${PLATFORM}-${DSM_VER}.json"
            SRC="dsm_linux/${TGZ}"
            DST="${RELEASES}/${TGZ}"

            if [ ! -f "$SRC" ]; then
              echo "SKIP: $SRC not found"
              continue
            fi

            cp "$SRC" "$DST"
            NEW_SHA=$(sha256sum "$DST" | awk '{print $1}')
            echo "${PLATFORM}: ${NEW_SHA}"

            # JSON sha256 갱신 (첫 번째 파일 항목 = 모듈 tarball)
            JSON_PATH="${RELEASES}/${JSON}"
            if [ -f "$JSON_PATH" ]; then
              jq --arg name "$TGZ" --arg sha "$NEW_SHA" \
                '.files |= map(if .name == $name then .sha256 = $sha else . end)' \
                "$JSON_PATH" > /tmp/updated.json && mv /tmp/updated.json "$JSON_PATH"
              echo "Updated $JSON_PATH"
            else
              echo "WARNING: $JSON_PATH not found, skipping JSON update"
            fi
          done

      - name: Commit and push to tcrp-modules
        run: |
          set -eux
          cd tcrp-modules
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom-modules/releases/*.tgz custom-modules/releases/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: update module tarballs + sha256 from dsm_linux master (run ${{ github.run_id }})"
            git push origin main
          fi

      - name: Copy bzImage files to redpill-load
        run: |
          set -eux
          DSM_VER="7.3"
          KVER="5.10.55"
          ZIMAGE_DST="redpill-load/ext/custom-zImage"

          for PLATFORM in epyc7002 geminilakenk r1000nk v1000nk; do
            BZIMAGE="bzImage-${PLATFORM}-${DSM_VER}-${KVER}.gz"
            SRC="dsm_linux/${BZIMAGE}"
            DST="${ZIMAGE_DST}/${BZIMAGE}"

            if [ ! -f "$SRC" ]; then
              echo "SKIP: $SRC not found"
              continue
            fi

            cp "$SRC" "$DST"
            echo "Copied: ${BZIMAGE}"
          done

      - name: Commit and push bzImage to redpill-load
        run: |
          set -eux
          cd redpill-load
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ext/custom-zImage/bzImage-*.gz
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: update bzImage from dsm_linux master (run ${{ github.run_id }})"
            git push origin master
          fi
